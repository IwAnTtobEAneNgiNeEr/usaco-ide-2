name: Bug report
description: Report a reproducible correctness or reliability problem
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include expected and observed behavior using synthetic data; follow SECURITY.md for private reports.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: List exact steps, problem data, and verdicts where relevant. Remove API keys.
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Source identity
      description: Provide an established Git commit, or the ZIP/source manifest SHA-256 when no Git history exists. Never invent a commit.
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - Browser/local backend
        - Electron desktop
        - Judge
        - AI/test provenance
        - Persistence/migration
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste relevant logs with secrets and personal paths removed.
      render: shell
