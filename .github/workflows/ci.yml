name: Repository static checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      # v6 tags independently resolved against the official repositories on 2026-10-17.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      # No dependency install, C++/application execution, browser, secrets or deployment.
      - name: Bounded syntax, JSON and repository hygiene
        run: node scripts/verify-repository.cjs
